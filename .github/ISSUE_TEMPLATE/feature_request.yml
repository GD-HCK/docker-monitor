name: Feature request
description: An idea to make Docker Monitor better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, rather than the solution, is the most useful part.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Keys, layout, a sketch: anything goes.
